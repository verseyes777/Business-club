<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کلوپ حرفه‌ای‌ها</title>
<style>
  :root{
    --ink:#12181B; --surface:#1B2328; --raised:#232C31; --line:#2E393F;
    --gold:#D4A24E; --goldSoft:#3A3120; --teal:#5FA8A0; --text:#ECE7DD; --muted:#93A0A3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ink); color:var(--text); min-height:100vh; font-family:Tahoma,"Segoe UI",sans-serif;}
  .header{position:sticky; top:0; z-index:10; background:var(--ink); border-bottom:1px solid var(--line); padding:16px 16px 8px;}
  .header-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .header-sub{color:var(--muted); font-size:12px;}
  .header-title{color:var(--text); font-size:18px; font-weight:700; line-height:1.2;}
  .header-en{color:var(--muted); font-size:10px; letter-spacing:.5px;}
  .coin-pill{display:flex; align-items:center; gap:6px; background:var(--goldSoft); border:1px solid #D4A24E55; border-radius:999px; padding:6px 12px;}
  .coin-pill span{color:var(--gold); font-size:14px; font-weight:600;}
  .nav{display:flex; gap:4px; overflow-x:auto; padding-bottom:4px;}
  .nav::-webkit-scrollbar{display:none;}
  .nav button{display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:8px; font-size:12px; font-weight:500; white-space:nowrap; border:none; background:transparent; color:var(--muted); cursor:pointer; font-family:inherit;}
  .nav button.active{background:var(--gold); color:var(--ink);}
  main{padding:16px; padding-bottom:40px; max-width:560px; margin:0 auto;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .stat-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;}
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; flex:1; min-width:145px;}
  .stat-label{color:var(--muted); font-size:12px; margin-bottom:10px; display:flex; justify-content:space-between;}
  .stat-value{color:var(--text); font-size:22px; font-weight:700;}
  .section-title{color:var(--text); font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .banner{background:var(--goldSoft); border:1px solid #D4A24E55; border-radius:12px; padding:14px; color:var(--gold); font-size:14px; font-weight:600; margin-bottom:20px;}
  .list-item{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .avatar{width:36px; height:36px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0;}
  .grow{flex:1; min-width:0;}
  .name{font-size:14px; color:var(--text); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sub{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tag{font-size:11px; color:var(--teal); display:flex; align-items:center; gap:4px; flex-shrink:0;}
  .empty{color:var(--muted); font-size:13px;}
  table{width:100%; border-collapse:collapse;}
  th{color:var(--muted); font-size:11px; font-weight:500; text-align:right; padding:8px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{color:var(--text); font-size:13px; padding:8px; border-bottom:1px solid var(--line);}
  tr.row{cursor:pointer;}
  .detail-row td{background:var(--raised); font-size:12px; color:var(--muted); line-height:1.9;}
  .toolbar{display:flex; gap:8px; margin-bottom:12px;}
  .search{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 12px; color:var(--text); font-size:13px; outline:none; font-family:inherit;}
  .search::placeholder{color:var(--muted);}
  .btn-gold{background:var(--gold); color:var(--ink); border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:4px; font-family:inherit;}
  .btn-ghost{background:none; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 12px; font-size:12px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:5px; font-family:inherit;}
  .btn-danger-outline{background:none; border:1px solid #C1614C55; color:#C1614C; border-radius:8px; padding:8px 12px; font-size:12px; cursor:pointer; font-family:inherit;}
  .chip-row{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{font-size:12px; padding:6px 12px; border-radius:999px; white-space:nowrap; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; font-family:inherit;}
  .chip.active{background:var(--gold); color:var(--ink); border-color:var(--gold);}
  .modal-overlay{position:fixed; inset:0; background:#000000aa; z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:var(--surface); border:1px solid var(--line); border-radius:16px 16px 0 0; padding:20px; width:100%; max-width:420px; max-height:88vh; overflow-y:auto;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .modal input, .modal select, .modal textarea{width:100%; background:var(--ink); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 12px; font-size:13px; outline:none; font-family:inherit; margin-bottom:10px;}
  .modal label{color:var(--muted); font-size:11px; display:block; margin-bottom:4px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:10px;}
  .grid3 select{margin-bottom:0;}
  .close-x{background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px;}
  .star-badge{background:var(--goldSoft); border:1px solid #D4A24E55; color:var(--gold); font-size:12px; border-radius:999px; padding:5px 12px; display:inline-flex; align-items:center; gap:5px; margin-bottom:14px;}
  .adv-toggle{background:none; border:1px dashed var(--line); color:var(--muted); width:100%; text-align:center; padding:9px; border-radius:8px; font-size:12px; cursor:pointer; font-family:inherit; margin:6px 0 14px;}
  .adv-section{display:none; border-top:1px solid var(--line); padding-top:12px; margin-top:-4px;}
  .adv-section.open{display:block;}
  .gantt-row{margin-bottom:16px;}
  .gantt-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:8px;}
  .gantt-task{display:flex; align-items:center; gap:8px; cursor:pointer; background:none; border:none; font-family:inherit; min-width:0;}
  .gantt-track{background:var(--ink); border-radius:6px; height:24px; position:relative;}
  .gantt-bar{position:absolute; top:0; height:100%; border-radius:6px; overflow:hidden;}
  .gantt-fill{height:100%; opacity:.7;}
  .legend{display:flex; gap:16px; font-size:12px; margin-bottom:14px; color:var(--muted);}
  .dot{width:8px; height:8px; border-radius:999px; display:inline-block; margin-inline-end:6px; flex-shrink:0;}
  .bars{height:150px; display:flex; align-items:flex-end; gap:12px; padding-top:10px;}
  .bar-wrap{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .bar{width:100%; border-radius:6px 6px 0 0; background:var(--gold);}
  .bar-label{font-size:10px; color:var(--muted); text-align:center;}
  svg.linechart{width:100%; height:180px;}
  .funnel-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .funnel-label{width:88px; font-size:11px; color:var(--muted); flex-shrink:0; text-align:left;}
  .funnel-track{flex:1; background:var(--ink); border-radius:6px; height:26px; position:relative; overflow:hidden;}
  .funnel-fill{height:100%; display:flex; align-items:center; padding-inline-start:8px; color:var(--ink); font-size:11px; font-weight:700; border-radius:6px;}
  .overdue{color:#C1614C !important;}
  .ended-row{opacity:.5;}
  .badge{font-size:10px; padding:2px 8px; border-radius:999px; display:inline-block;}
  .badge-customer{background:#9BB67322; color:#9BB673;}
  .badge-ended{background:#C1614C22; color:#C1614C;}
  .row-actions{display:flex; gap:8px; margin-top:10px;}
  .toggle-group{display:flex; gap:8px; margin-bottom:12px;}
  .toggle-opt{flex:1; text-align:center; padding:9px; border-radius:8px; border:1px solid var(--line); color:var(--muted); font-size:12px; cursor:pointer;}
  .toggle-opt.active{background:var(--gold); color:var(--ink); border-color:var(--gold);}
  .sale-amount{color:var(--gold); font-weight:600;}
  .sale-hidden{color:var(--muted); font-size:12px;}
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:28px 24px; width:100%; max-width:340px;}
  .login-title{font-size:20px; font-weight:700; color:var(--text); text-align:center; margin-bottom:2px;}
  .login-en{font-size:11px; color:var(--muted); text-align:center; margin-bottom:24px;}
  .login-card input{width:100%; background:var(--ink); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:11px 14px; font-size:14px; outline:none; font-family:inherit; margin-bottom:12px;}
  .login-card label{color:var(--muted); font-size:12px; display:block; margin-bottom:5px;}
  .login-error{color:#C1614C; font-size:12px; margin-bottom:10px; display:none;}
  .login-error.show{display:block;}
  .logout-btn{background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:6px 10px; font-size:11px; cursor:pointer; font-family:inherit;}
  .app-hidden{display:none !important;}
</style>
</head>

<script>
/* ================= Jalali (Shamsi) calendar conversion ================= */
const JALALI_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];

function g2j(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy<=1600)?0:979;
  gy -= (gy<=1600)?621:1600;
  const gy2 = (gm>2)?(gy+1):gy;
  let days = (365*gy) + (Math.floor((gy2+3)/4)) - (Math.floor((gy2+99)/100)) + (Math.floor((gy2+399)/400)) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053);
  days %= 12053;
  jy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){ jy += Math.floor((days-1)/365); days = (days-1)%365; }
  let jm, jd;
  if(days < 186){ jm = 1 + Math.floor(days/31); jd = 1 + (days%31); }
  else { jm = 7 + Math.floor((days-186)/30); jd = 1 + ((days-186)%30); }
  return [jy, jm, jd];
}
function j2g(jy, jm, jd){
  let gy = (jy<=979)?621:1600;
  jy -= (jy<=979)?0:979;
  let days = (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + 78 + jd + ((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  gy += 400*Math.floor(days/146097);
  days %= 146097;
  if(days > 36524){
    gy += 100*Math.floor((days-1)/36524);
    days = (days-1) % 36524;
    if(days >= 365) days++;
  }
  gy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){ gy += Math.floor((days-1)/365); days = (days-1)%365; }
  let gd = days + 1;
  const isLeap = (gy%4===0 && gy%100!==0) || (gy%400===0);
  const sal_a = [0,31,isLeap?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm=0;
  for(gm=1; gm<13; gm++){
    if(gd <= sal_a[gm]) break;
    gd -= sal_a[gm];
  }
  return [gy, gm, gd];
}
function dateToJalali(d){ return g2j(d.getFullYear(), d.getMonth()+1, d.getDate()); }
function jalaliToDate(jy,jm,jd){
  const [gy,gm,gd] = j2g(jy,jm,jd);
  const d = new Date(gy, gm-1, gd); d.setHours(0,0,0,0); return d;
}

/* ================= date helpers ================= */
function addDays(base,n){ const d=new Date(base); d.setDate(d.getDate()+n); d.setHours(0,0,0,0); return d; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function fmtDate(d){ if(!d) return ""; const [jy,jm,jd]=dateToJalali(d); return `${fa(jd)} ${JALALI_MONTHS[jm-1]} ${fa(jy)}`; }
function toISO(d){ return d.toISOString().slice(0,10); }
function parseISO(s){ if(!s) return null; return new Date(s+'T00:00:00'); }
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

function jalaliPicker(id, defaultDate, yearsBack, yearsFwd){
  yearsBack = yearsBack===undefined?3:yearsBack;
  yearsFwd = yearsFwd===undefined?3:yearsFwd;
  const cur = dateToJalali(TODAY);
  const dv = defaultDate ? dateToJalali(defaultDate) : [null,null,null];
  let dayOpts=`<option value="">روز</option>`;
  for(let i=1;i<=31;i++) dayOpts+=`<option value="${i}" ${dv[2]===i?"selected":""}>${fa(i)}</option>`;
  let monthOpts=`<option value="">ماه</option>`;
  JALALI_MONTHS.forEach((m,i)=>{ monthOpts+=`<option value="${i+1}" ${dv[1]===i+1?"selected":""}>${m}</option>`; });
  let yearOpts=`<option value="">سال</option>`;
  for(let y=cur[0]-yearsBack;y<=cur[0]+yearsFwd;y++) yearOpts+=`<option value="${y}" ${dv[0]===y?"selected":""}>${fa(y)}</option>`;
  return `<div class="grid3">
    <select id="${id}_d">${dayOpts}</select>
    <select id="${id}_m">${monthOpts}</select>
    <select id="${id}_y">${yearOpts}</select>
  </div>`;
}
function readJalaliField(id){
  const de=document.getElementById(id+"_d"), me=document.getElementById(id+"_m"), ye=document.getElementById(id+"_y");
  if(!de || !me || !ye) return null;
  const d=de.value, m=me.value, y=ye.value;
  if(!d||!m||!y) return null;
  return jalaliToDate(Number(y), Number(m), Number(d));
}

/* ================= persistence (per-user, localStorage) ================= */
function serializePeople(arr){
  return arr.map(p=>({...p, contactDate:p.contactDate?toISO(p.contactDate):null,
    nextActions:(p.nextActions||[]).map(na=>({...na, date:na.date?toISO(na.date):null}))}));
}
function deserializePeople(arr){
  return arr.map(p=>{
    let nextActions;
    if(p.nextActions){
      nextActions = p.nextActions.map(na=>({...na, date:na.date?parseISO(na.date):null}));
    } else if(p.nextContact){
      // migration from the old single next-contact/next-action fields
      nextActions = [{id:1, date:parseISO(p.nextContact), action:p.nextAction||""}];
    } else {
      nextActions = [];
    }
    return {...p, contactDate:p.contactDate?parseISO(p.contactDate):null, nextActions};
  });
}
function serializeTasks(arr){ return arr.map(t=>({...t, start:toISO(t.start), due:toISO(t.due)})); }
function deserializeTasks(arr){ return arr.map(t=>({...t, start:parseISO(t.start), due:parseISO(t.due)})); }
function serializeSales(arr){ return arr.map(s=>({...s, date:toISO(s.date)})); }
function deserializeSales(arr){ return arr.map(s=>({...s, date:parseISO(s.date)})); }
function storageKey(username){ return "bc_data_"+username; }

function saveUserData(){
  if(!CURRENT_USER) return;
  const blob = { people:serializePeople(people), tasks:serializeTasks(tasks), sales:serializeSales(sales), PROFESSIONS, MARKET_SEGMENTS, PROJECTS, WORKERS, bonusCoins };
  localStorage.setItem(storageKey(CURRENT_USER.username), JSON.stringify(blob));
}

function loadUserData(username){
  const raw = localStorage.getItem(storageKey(username));
  if(raw){
    try{
      const blob = JSON.parse(raw);
      people = deserializePeople(blob.people);
      tasks = deserializeTasks(blob.tasks);
      sales = blob.sales ? deserializeSales(blob.sales) : seedSalesFor(username);
      PROFESSIONS = (blob.PROFESSIONS && blob.PROFESSIONS.length) ? blob.PROFESSIONS : defaultProfessions();
      MARKET_SEGMENTS = (blob.MARKET_SEGMENTS && blob.MARKET_SEGMENTS.length) ? blob.MARKET_SEGMENTS : defaultSegments();
      PROJECTS = (blob.PROJECTS && blob.PROJECTS.length) ? blob.PROJECTS : defaultProjects();
      WORKERS = (blob.WORKERS && blob.WORKERS.length) ? blob.WORKERS : [USERS[username].name];
      bonusCoins = blob.bonusCoins || 0;
      people.forEach(p=>{ if(p.ended===undefined) p.ended=false; if(p.endReason===undefined) p.endReason=""; if(!p.nextActions) p.nextActions=[]; });
      return;
    }catch(e){ /* fall through to fresh seed */ }
  }
  people = seedPeopleFor(username);
  tasks = seedTasksFor(username);
  sales = seedSalesFor(username);
  PROFESSIONS = defaultProfessions();
  MARKET_SEGMENTS = defaultSegments();
  PROJECTS = defaultProjects();
  WORKERS = [USERS[username].name];
  bonusCoins = 0;
}

/* ================= shared (cross-member) data =================
   اینها بین همه‌ی اعضا مشترکن (نه فقط خود فرد) — فرصت‌ها و پروفایل‌ها باید بین اعضا دیده بشن.
   چون این نسخه هنوز سرور/دیتابیس واقعی نداره، این اطلاعات فقط در localStorage همین مرورگر مشترکه —
   یعنی اگر با یک مرورگر بین حساب‌ها جابه‌جا (لاگین/لاگ‌اوت) بشی می‌بینیشون، ولی بین گوشی‌ها/مرورگرهای
   مختلف به‌اشتراک گذاشته نمی‌شه. برای نسخه‌ی واقعی روی دامنه‌ی اصلی، این بخش باید به یک دیتابیس واقعی وصل بشه. */
function loadOpportunities(){
  const raw = localStorage.getItem("bc_opportunities");
  if(raw){
    try{ opportunities = JSON.parse(raw).map(o=>({...o, date:parseISO(o.date)})); return; }catch(e){}
  }
  opportunities = seedOpportunities();
  saveOpportunities();
}
function saveOpportunities(){
  localStorage.setItem("bc_opportunities", JSON.stringify(opportunities.map(o=>({...o, date:toISO(o.date)}))));
}
function loadProfiles(){
  const raw = localStorage.getItem("bc_profiles");
  profiles = raw ? JSON.parse(raw) : {};
}
function saveProfiles(){
  localStorage.setItem("bc_profiles", JSON.stringify(profiles));
}

function doLogin(){
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  const err = document.getElementById("loginError");
  if(USERS[u] && USERS[u].password===p){
    CURRENT_USER = { username:u, name:USERS[u].name };
    localStorage.setItem("bc_session", u);
    loadUserData(u);
    loadOpportunities();
    loadProfiles();
    err.classList.remove("show");
    showApp();
  } else {
    err.classList.add("show");
  }
}
function doLogout(){
  localStorage.removeItem("bc_session");
  CURRENT_USER = null;
  document.getElementById("appRoot").classList.add("app-hidden");
  document.getElementById("loginScreen").classList.remove("app-hidden");
  document.getElementById("loginUser").value = "";
  document.getElementById("loginPass").value = "";
}
function showApp(){
  document.getElementById("loginScreen").classList.add("app-hidden");
  document.getElementById("appRoot").classList.remove("app-hidden");
  tab = "today"; netQuery = ""; netCat = "همه"; expandedRow = null; todayExpandedId = null; profRows = null; servRows = null;
  render();
}
function trySessionRestore(){
  const saved = localStorage.getItem("bc_session");
  if(saved && USERS[saved]){
    CURRENT_USER = { username:saved, name:USERS[saved].name };
    loadUserData(saved);
    loadOpportunities();
    loadProfiles();
    showApp();
  }
}

function dueActionsFlat(){
  const flat = [];
  people.forEach(p=>{
    if(p.ended) return;
    (p.nextActions||[]).forEach(na=>{
      if(na.date && na.date <= TODAY) flat.push({person:p, na});
    });
  });
  return flat.sort((a,b)=> a.na.date - b.na.date);
}

  const contactsDue = dueActionsFlat();

  const tasksSorted = [...tasks].sort((a,b)=>{
    if((a.progress===100) !== (b.progress===100)) return a.progress===100 ? 1 : -1;
    return a.due - b.due;
  });

  return `
    <div class="banner">امروز ${fa(contactsDue.length)} تماس در انتظار و ${fa(tasks.filter(t=>t.progress<100).length)} کار باز داری</div>

          <div style="text-align:left;flex-shrink:0;">
            <div class="tag">${p.contactType||""}</div>
            <div class="sub ${overdue>0?'overdue':''}">${overdue>0? fa(overdue)+" روز تأخیر" : "امروز"}</div>

function openSaleModal(prefillPersonId, note){
  document.getElementById("modalHost").innerHTML = addSaleModal(prefillPersonId, note);
  document.getElementById("overlay").addEventListener("click", (e)=>{ if(e.target.id==="overlay") document.getElementById("modalHost").innerHTML=""; });
  document.getElementById("closeModal").addEventListener("click", ()=> document.getElementById("modalHost").innerHTML="");
  document.getElementById("sPersonName").addEventListener("input", ()=> document.getElementById("saleError").classList.remove("show"));
  document.getElementById("submitSale").addEventListener("click", ()=>{
    const name = document.getElementById("sPersonName").value.trim();
    const errEl = document.getElementById("saleError");
    const person = people.find(p=>!p.ended && p.name===name);
    if(!person){ errEl.classList.add("show"); return; }
    errEl.classList.remove("show");
    const title = document.getElementById("sTitle").value.trim();
    if(!title) return;
    const amount = Number(document.getElementById("sAmount").value)||0;
    const date = readJalaliField("sDate") || TODAY;
    const showRevenue = document.getElementById("sShowRevenue").checked;
    const priorSalesCount = sales.filter(s=>s.personId===person.id).length;
    sales.push({ id:Date.now(), personId:person.id, personName:person.name, title, amount, date, showRevenue });
    person.stage = priorSalesCount>0 ? "تکرار خرید" : "خرید";
    person.nextActions = person.nextActions || [];
    person.nextActions.push({ id:Date.now()+1, date:addDays(date,30), action:"خرید" });
    saveUserData();
    document.getElementById("modalHost").innerHTML="";
    render();
  });
}

      tasks.push({ id: Date.now(), title, who, project, by:"شخصی", start: TODAY, due, progress:0, coin:0, desc, cost });
    }
    saveUserData();
    document.getElementById("modalHost").innerHTML="";

/* ================= Stats (with funnel) ================= */
function statsSection(){
  const ganttDone = Math.round(tasks.reduce((s,t)=>s+t.progress,0)/tasks.length);
  const maxG = Math.max(...MY_GROWTH);
  const w=300,h=160,pad=20;
  const pts = MY_GROWTH.map((v,i)=>{
    const x = pad + (i*(w-2*pad)/(MY_GROWTH.length-1));
    const y = h-pad - (v/maxG)*(h-2*pad);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?"M":"L")+p[0]+","+p[1]).join(" ");
  const dots = pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#D4A24E"/>`).join("");
  const maxTool = Math.max(...MY_TOOL_USE.map(t=>t.pct));

  const stageCounts = STAGES.map(s=> ({stage:s, count: people.filter(p=>p.stage===s && !p.ended).length}));
  const maxStage = Math.max(...stageCounts.map(s=>s.count),1);
  const visibleRevenue = sales.filter(s=>s.showRevenue).reduce((s,x)=>s+x.amount,0);

  return `
    <div class="stat-row">
      <div class="stat-card"><div class="stat-label"><span>مخاطبین شبکه من</span>👥</div><div class="stat-value">${fa(people.length)}</div></div>
      <div class="stat-card"><div class="stat-label"><span>سکه‌های من</span>🪙</div><div class="stat-value">${fa(coinTotal())}</div></div>
      <div class="stat-card"><div class="stat-label"><span>مشتریان</span>🧑‍🤝‍🧑</div><div class="stat-value">${fa(people.filter(isCustomer).length)}</div></div>
      <div class="stat-card"><div class="stat-label"><span>پیشرفت گانت چارت من</span>📋</div><div class="stat-value">٪${fa(ganttDone)}</div></div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="section-title">قیف فروش (بر اساس مرحله بازاریابی)</div>
      <div style="color:#93A0A3;font-size:12px;margin-bottom:14px;">تعداد مخاطبین شبکه‌ی من در هر مرحله</div>
      ${stageCounts.map(s=>`
        <div class="funnel-row">
          <div class="funnel-label">${s.stage}</div>
          <div class="funnel-track">
            <div class="funnel-fill" style="width:${Math.max((s.count/maxStage)*100,s.count>0?14:0)}%;background:#D4A24E">${s.count>0?fa(s.count):""}</div>
          </div>
        </div>`).join("")}
      <div style="border-top:1px solid #2E393F;margin-top:8px;padding-top:10px;color:#93A0A3;font-size:12px;">درآمد نمایش‌داده‌شده از فروش‌ها: <span style="color:#D4A24E;font-weight:600;">${fa(visibleRevenue)} تومان</span></div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="section-title">روند رشد شبکه‌ی من</div>
      <div style="color:#93A0A3;font-size:12px;margin-bottom:10px;">تعداد مخاطبینی که در ۸ هفته‌ی گذشته اضافه کرده‌ام</div>
      <svg class="linechart" viewBox="0 0 300 160">
        <path d="${path}" fill="none" stroke="#D4A24E" stroke-width="2.5"/>
        ${dots}
      </svg>
    </div>

    <div class="card">
      <div class="section-title">استفاده من از ابزارها</div>
      <div style="color:#93A0A3;font-size:12px;margin-bottom:10px;">درصد رشد استفاده در ماه جاری</div>
      <div class="bars">
        ${MY_TOOL_USE.map(t=>`
          <div class="bar-wrap">
            <div class="bar" style="height:${(t.pct/maxTool)*100}%;background:#5FA8A0"></div>
            <div class="bar-label">${t.tool}<br>٪${fa(t.pct)}</div>
          </div>`).join("")}
      </div>
    </div>
  `;
}
const MY_GROWTH = [1,2,2,3,4,5,6,7];
const MY_TOOL_USE = [{tool:"شبکه",pct:24},{tool:"گانت چارت",pct:31},{tool:"آمار",pct:12}];

function profRowHTML(idx, val){
  return `<div style="display:flex;gap:8px;margin-bottom:8px;">
    <input class="prof-text" data-idx="${idx}" value="${val||""}" placeholder="حرفه" list="professionList" style="flex:1;background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;font-family:inherit;">
    <button type="button" class="remove-prof-row" data-idx="${idx}" style="background:none;border:1px solid var(--line);color:#C1614C;border-radius:8px;padding:0 12px;cursor:pointer;font-family:inherit;">حذف</button>
  </div>`;
}
function ensureProfRowsInit(){
  if(profRows===null){
    const saved = profiles[CURRENT_USER.username];
    const list = (saved && saved.professions && saved.professions.length) ? saved.professions
      : (saved && saved.profession ? [saved.profession] : [""]);
    profRows = list.slice();
  }
}
function syncProfRowsFromDom(){
  document.querySelectorAll(".prof-text").forEach(el=>{ profRows[Number(el.dataset.idx)] = el.value; });
}
function rerenderProfRows(){
  document.getElementById("profRowsWrap").innerHTML = profRows.map((v,i)=>profRowHTML(i,v)).join("");
}

function servRowHTML(idx, val){
  return `<div style="display:flex;gap:8px;margin-bottom:8px;">
    <input class="serv-text" data-idx="${idx}" value="${val||""}" placeholder="مثلاً: طراحی پوستر و تراکت" style="flex:1;background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;font-family:inherit;">
    <button type="button" class="remove-serv-row" data-idx="${idx}" style="background:none;border:1px solid var(--line);color:#C1614C;border-radius:8px;padding:0 12px;cursor:pointer;font-family:inherit;">حذف</button>
  </div>`;
}
function ensureServRowsInit(){
  if(servRows===null){
    const saved = profiles[CURRENT_USER.username];
    const list = (saved && saved.servicesList && saved.servicesList.length) ? saved.servicesList
      : (saved && saved.services ? [saved.services] : [""]);
    servRows = list.slice();
  }
}
function syncServRowsFromDom(){
  document.querySelectorAll(".serv-text").forEach(el=>{ servRows[Number(el.dataset.idx)] = el.value; });
}
function rerenderServRows(){
  document.getElementById("servRowsWrap").innerHTML = servRows.map((v,i)=>servRowHTML(i,v)).join("");
}

function profilePage(){
  ensureProfRowsInit();
  ensureServRowsInit();
  const my = profiles[CURRENT_USER.username] || {professions:[], bio:"", servicesList:[]};
  const others = Object.entries(profiles).filter(([u,pr])=> u!==CURRENT_USER.username && ((pr.professions&&pr.professions.length)||pr.profession||pr.bio||pr.services||(pr.servicesList&&pr.servicesList.length)) && USERS[u]);
  return `
    <div class="card" style="margin-bottom:16px;">
      <div class="section-title">پروفایل من — ${CURRENT_USER.name}</div>
      <label style="color:var(--muted);font-size:11px;display:block;margin-bottom:4px;">حرفه(ها)</label>
      <datalist id="professionList">${PROFESSIONS.map(x=>`<option value="${x}">`).join("")}</datalist>
      <div id="profRowsWrap">${profRows.map((v,i)=>profRowHTML(i,v)).join("")}</div>
      <button type="button" class="btn-ghost" id="addProfRow" style="margin-bottom:14px;">+ افزودن حرفه‌ی دیگر</button>

      <label style="color:var(--muted);font-size:11px;display:block;margin-bottom:4px;">درباره‌ی من</label>
      <textarea id="pBio" rows="2" placeholder="یه معرفی کوتاه از خودت" style="width:100%;background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;font-family:inherit;margin-bottom:10px;resize:vertical;">${my.bio||""}</textarea>

      <label style="color:var(--muted);font-size:11px;display:block;margin-bottom:4px;">محصولات و خدماتی که ارائه می‌دم</label>
      <div id="servRowsWrap">${servRows.map((v,i)=>servRowHTML(i,v)).join("")}</div>
      <button type="button" class="btn-ghost" id="addServRow" style="margin-bottom:14px;">+ افزودن محصول یا خدمت دیگر</button>

      <button class="btn-gold" id="saveProfile">ذخیره پروفایل</button>
    </div>

    <div class="banner">خدمات کلوپ برای اعضا رایگان یا با تخفیف بالاست و در ازای سکه قابل استفاده‌ست.</div>

    <div class="section-title">خدمات سایر اعضای کلوپ</div>
    ${others.length===0?`<div class="empty" style="margin-bottom:20px;">هنوز عضو دیگه‌ای پروفایلش رو تکمیل نکرده.</div>`:
      others.map(([u,pr])=>{
        const profs = (pr.professions&&pr.professions.length) ? pr.professions.join("، ") : (pr.profession||"");
        const servs = (pr.servicesList&&pr.servicesList.length) ? pr.servicesList.join("، ") : (pr.services||"");
        return `
        <div class="list-item">
          <div class="avatar" style="background:${colorFor(profs||u)}22;color:${colorFor(profs||u)}">${USERS[u].name[0]}</div>
          <div class="grow">
            <div class="name">${USERS[u].name}${profs?` · ${profs}`:""}</div>
            <div class="sub">${servs||pr.bio||""}</div>
          </div>
        </div>`;}).join("") + `<div style="height:20px"></div>`}

    ${statsSection()}
  `;
}

/* ================= handlers ================= */
function attachHandlers(){
  document.querySelectorAll(".toggle-task").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = Number(el.dataset.id);
      const t = tasks.find(x=>x.id===id);
      if(!t) return;
      const newProgress = t.progress===100 ? 60 : 100;
      tasks = tasks.map(x=> x.id===id ? {...x, progress:newProgress} : x);
      if(newProgress===100 && t.opportunityId){
        const o = opportunities.find(op=>op.id===t.opportunityId);
        if(o){
          const claim = (o.claims||[]).find(c=>c.ganttTaskId===id);
          if(claim && claim.status!=="انجام شد"){
            claim.status = "انجام شد";
            bonusCoins += (t.coin||0);
            saveOpportunities();
          }
        }
      }
      saveUserData();
      render();
    });
  });

  // shared between Today and Network: viewing/editing a contact and logging a new interaction
  document.querySelectorAll(".edit-contact").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const person = people.find(p=>p.id===Number(el.dataset.id));
      openContactModal(person);
    });
  });
  document.querySelectorAll(".log-interaction").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const person = people.find(p=>p.id===Number(el.dataset.id));
      openLogInteraction(person);
    });
  });

  // shared between Today and Gantt: opening a task to view/edit it
  document.querySelectorAll(".edit-task").forEach(el=>{
    el.addEventListener("click", ()=>{
      const t = tasks.find(x=>x.id===Number(el.dataset.id));
      openTaskModal(t);
    });
  });

  if(tab==="today"){
    document.querySelectorAll(".today-contact-row").forEach(el=>{
      el.addEventListener("click", ()=>{
        const id = Number(el.dataset.id);
        todayExpandedId = todayExpandedId===id ? null : id;
        render();
      });
    });
  }

  if(tab==="network"){
    document.getElementById("netSearch").addEventListener("input", e=>{
      netQuery = e.target.value; render();
      const el=document.getElementById("netSearch"); el.focus(); el.selectionStart=el.selectionEnd=el.value.length;
    });
    document.querySelectorAll("[data-cat]").forEach(el=> el.addEventListener("click", ()=>{ netCat = el.dataset.cat; render(); }));
    document.querySelectorAll("tr.row").forEach(el=> el.addEventListener("click", (e)=>{
      const id = Number(el.dataset.id);
      expandedRow = expandedRow===id ? null : id;
      render();
    }));

    document.getElementById("openAdd").addEventListener("click", ()=> openContactModal(null));
  }

  if(tab==="sales"){
    document.getElementById("openAddSale").addEventListener("click", ()=> openSaleModal());
  }

  if(tab==="opportunities"){
    document.querySelectorAll(".claim-opp").forEach(el=>{
      el.addEventListener("click", ()=>{
        const o = opportunities.find(x=>x.id===Number(el.dataset.id));
        if(!o.claims) o.claims=[];
        if(o.claims.some(c=>c.username===CURRENT_USER.username)) return;
        const taskId = Date.now();
        o.claims.push({ username:CURRENT_USER.username, name:CURRENT_USER.name, status:"در حال انجام", ganttTaskId:taskId });
        if(!PROJECTS.includes("فرصت‌های فروش")) PROJECTS.push("فرصت‌های فروش");
        tasks.push({
          id: taskId, title: "فرصت: "+o.title, who: CURRENT_USER.name, project:"فرصت‌های فروش",
          by:"مدیریت", start: TODAY, due: addDays(TODAY,14), progress:0, coin:o.coinReward||0,
          desc:o.description||"", cost:0, opportunityId:o.id
        });
        saveOpportunities();
        saveUserData();
        render();
      });
    });
  }

  if(tab==="profile"){
    document.getElementById("profRowsWrap").addEventListener("click", (e)=>{
      if(e.target.classList.contains("remove-prof-row")){
        syncProfRowsFromDom();
        const idx = Number(e.target.dataset.idx);
        profRows.splice(idx,1);
        if(profRows.length===0) profRows.push("");
        rerenderProfRows();
      }
    });
    document.getElementById("addProfRow").addEventListener("click", ()=>{
      syncProfRowsFromDom();
      profRows.push("");
      rerenderProfRows();
    });
    document.getElementById("servRowsWrap").addEventListener("click", (e)=>{
      if(e.target.classList.contains("remove-serv-row")){
        syncServRowsFromDom();
        const idx = Number(e.target.dataset.idx);
        servRows.splice(idx,1);
        if(servRows.length===0) servRows.push("");
        rerenderServRows();
      }
    });
    document.getElementById("addServRow").addEventListener("click", ()=>{
      syncServRowsFromDom();
      servRows.push("");
      rerenderServRows();
    });
    document.getElementById("saveProfile").addEventListener("click", ()=>{
      syncProfRowsFromDom();
      syncServRowsFromDom();
      const professions = profRows.map(v=>v.trim()).filter(v=>v!=="");
      const servicesList = servRows.map(v=>v.trim()).filter(v=>v!=="");
      professions.forEach(p=>{ if(!PROFESSIONS.includes(p)) PROFESSIONS.push(p); });
      profiles[CURRENT_USER.username] = {
        professions,
        bio: document.getElementById("pBio").value.trim(),
        servicesList,
      };
      saveProfiles();
      profRows = null;
      servRows = null;
      render();
    });
  }

  if(tab==="gantt"){
    document.getElementById("openAddTask").addEventListener("click", ()=> openTaskModal(null));
  }
}

function nextActionRowHTML(idx, na){
  return `
  <div class="na-row" style="border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <label style="margin:0;">تاریخ ارتباط بعدی</label>
      <button type="button" class="remove-na-row" data-idx="${idx}" style="background:none;border:none;color:#C1614C;cursor:pointer;font-size:12px;">حذف</button>
    </div>
    ${jalaliPicker("na_"+idx, na?na.date:null)}
    <input class="na-text" data-idx="${idx}" placeholder="اقدام بعدی" value="${na?(na.action||""):""}">
  </div>`;
}

function openContactModal(person){
  document.getElementById("modalHost").innerHTML = contactModal(person);
  document.getElementById("overlay").addEventListener("click", (e)=>{ if(e.target.id==="overlay") document.getElementById("modalHost").innerHTML=""; });
  document.getElementById("closeModal").addEventListener("click", ()=> document.getElementById("modalHost").innerHTML="");
  document.getElementById("advToggle").addEventListener("click", ()=>{
    const sec = document.getElementById("advSection");
    sec.classList.toggle("open");
    document.getElementById("advToggle").textContent = sec.classList.contains("open") ? "نمایش اطلاعات بیشتر (اختیاری) ▴" : "نمایش اطلاعات بیشتر (اختیاری) ▾";
  });

  // ---- dynamic "next action" rows: adding a new one never erases the previous ones ----
  let naRows = (person && person.nextActions && person.nextActions.length)
    ? person.nextActions.slice().sort((a,b)=>a.date-b.date).map(na=>({date:na.date, action:na.action}))
    : [{date:null, action:""}];

  function syncNaRowsFromDom(){
    naRows.forEach((na,i)=>{
      na.date = readJalaliField("na_"+i);
      const textEl = document.querySelector(`.na-text[data-idx="${i}"]`);
      if(textEl) na.action = textEl.value;
    });
  }
  function renderNaRows(){
    document.getElementById("naRowsWrap").innerHTML = naRows.map((na,i)=> nextActionRowHTML(i, na)).join("");
    if(!person) updateStarCount();
  }
  renderNaRows();
  document.getElementById("naRowsWrap").addEventListener("click", (e)=>{
    if(e.target.classList.contains("remove-na-row")){
      syncNaRowsFromDom();
      const idx = Number(e.target.dataset.idx);
      naRows.splice(idx,1);
      if(naRows.length===0) naRows.push({date:null, action:""});
      renderNaRows();
    }
  });
  document.getElementById("naRowsWrap").addEventListener("input", ()=>{ if(!person) updateStarCount(); });
  document.getElementById("addNaRow").addEventListener("click", ()=>{
    syncNaRowsFromDom();
    naRows.push({date:null, action:""});
    renderNaRows();
  });

  if(!person){
    starEligibleFields().forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener("input", updateStarCount); });
    updateStarCount();
  }

  document.getElementById("submitContact").addEventListener("click", ()=>{
    const name = document.getElementById("fName").value.trim();
    if(!name) return;
    const profession = document.getElementById("fProfession").value.trim() || "سایر";
    const segment = document.getElementById("fSegment").value.trim();
    if(profession && !PROFESSIONS.includes(profession)) PROFESSIONS.push(profession);
    if(segment && !MARKET_SEGMENTS.includes(segment)) MARKET_SEGMENTS.push(segment);
    const adv = {
      "مشخصات حرفه": document.getElementById("advProfDetails").value.trim(),
      "تاریخ تولد": fmtDate(readJalaliField("advBirthday")),
      "وضعیت تاهل": document.getElementById("advMarital").value,
      "تعداد فرزند": document.getElementById("advChildren").value,
      "جنسیت": document.getElementById("advGender").value,
      "سطح مالی": document.getElementById("advFinance").value,
      "تحصیلات": document.getElementById("advEducation").value,
      "آدرس محل زندگی": document.getElementById("advHomeAddr").value.trim(),
      "آدرس محل کار": document.getElementById("advWorkAddr").value.trim(),
    };
    syncNaRowsFromDom();
    const nextActions = naRows.filter(na=>na.action && na.action.trim()!=="").map((na,i)=>({id:i+1, date:na.date, action:na.action.trim()}));
    const newStage = document.getElementById("fStage").value;
    const common = {
      name, phone: document.getElementById("fPhone").value.trim(),
      instagram: document.getElementById("fInsta").value.trim(),
      profession, segment, stage: newStage,
      contactDate: readJalaliField("fContactDate") || TODAY,
      contactType: document.getElementById("fContactType").value,
      contactResult: document.getElementById("fContactResult").value.trim(),
      nextActions,
      adv
    };
    const isPurchaseStage = newStage==="خرید" || newStage==="تکرار خرید";
    let targetPersonId, triggerSale = false;
    if(person){
      const oldStage = person.stage;
      const idx = people.findIndex(p=>p.id===person.id);
      people[idx] = {...people[idx], ...common};
      targetPersonId = person.id;
      if(isPurchaseStage && oldStage!==newStage) triggerSale = true;
    } else {
      let stars = 0;
      starEligibleFields().forEach(id=>{ const el=document.getElementById(id); if(el && el.value.trim()!=="") stars++; });
      if(nextActions.length) stars++;
      if(readJalaliField("advBirthday")) stars++;
      const newId = Date.now();
      people.push({ id: newId, coins: stars, referredBy:"—", ended:false, endReason:"", ...common });
      targetPersonId = newId;
      if(isPurchaseStage) triggerSale = true;
    }
    saveUserData();
    document.getElementById("modalHost").innerHTML="";
    render();
    if(triggerSale){
      openSaleModal(targetPersonId, "مرحله‌ی این مخاطب به «"+newStage+"» تغییر کرد — جزئیات این فروش رو ثبت کن.");
    }
  });
}

function openLogInteraction(person){
  document.getElementById("modalHost").innerHTML = logInteractionModal(person);
  document.getElementById("overlay").addEventListener("click", (e)=>{ if(e.target.id==="overlay") document.getElementById("modalHost").innerHTML=""; });
  document.getElementById("closeModal").addEventListener("click", ()=> document.getElementById("modalHost").innerHTML="");
  const optContinue = document.getElementById("optContinue");
  const optEnd = document.getElementById("optEnd");
  const continueBlock = document.getElementById("continueBlock");
  const endBlock = document.getElementById("endBlock");
  let mode = "continue";
  optContinue.addEventListener("click", ()=>{ mode="continue"; optContinue.classList.add("active"); optEnd.classList.remove("active"); continueBlock.style.display="block"; endBlock.style.display="none"; });
  optEnd.addEventListener("click", ()=>{ mode="end"; optEnd.classList.add("active"); optContinue.classList.remove("active"); continueBlock.style.display="none"; endBlock.style.display="block"; });

  document.getElementById("submitInteraction").addEventListener("click", ()=>{
    const idx = people.findIndex(p=>p.id===person.id);
    const date = readJalaliField("liDate") || TODAY;
    const type = document.getElementById("liType").value;
    const result = document.getElementById("liResult").value.trim();
    if(mode==="end"){
      const reason = document.getElementById("liEndReason").value.trim();
      people[idx] = {...people[idx], contactDate:date, contactType:type, contactResult:result, ended:true, endReason:reason, nextActions:[]};
    } else {
      const nextAction = document.getElementById("liNextAction").value.trim();
      const nextContact = readJalaliField("liNextContact");
      const existing = people[idx].nextActions || [];
      const updated = nextAction ? [...existing, {id:Date.now(), date:nextContact, action:nextAction}] : existing;
      people[idx] = {...people[idx], contactDate:date, contactType:type, contactResult:result, nextActions:updated};
    }
    saveUserData();
    document.getElementById("modalHost").innerHTML="";
    render();
  });
}
